<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#336633" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Life OS" />
    <meta name="description" content="Your unified Second Brain — Productivity, Finance, CRM, Wellness, Vision." />
    <title>Life OS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      /* Critical CSS — prevents layout shift on first paint */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root { height: 100%; }
      body { font-family: 'Figtree', sans-serif; background: #f8fafc; color: #0f172a; -webkit-font-smoothing: antialiased; }
      #root { display: flex; flex-direction: column; }
      .splash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #336633; z-index: 9999; }
      .splash svg { width: 64px; height: 64px; fill: white; animation: pulse 1s ease-in-out infinite; }
      @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash" id="splash">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Remove splash after app mounts
      window.__removeSplash = () => {
        const s = document.getElementById('splash');
        if (s) { s.style.opacity = '0'; s.style.transition = 'opacity 0.3s'; setTimeout(() => s.remove(), 300); }
      };
    </script>
  </body>
</html>
